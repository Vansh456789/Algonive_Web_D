<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskFlow - Personal Task Manager</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header class="app-header">
            <div class="header-content">
                <h1>TaskFlow</h1>
                <p class="subtitle">Stay organized, stay productive</p>
            </div>
            <div class="header-stats">
                <div class="stat">
                    <span class="stat-label">Total</span>
                    <span class="stat-value" id="totalTasks">0</span>
                </div>
                <div class="stat">
                    <span class="stat-label">Completed</span>
                    <span class="stat-value" id="completedTasks">0</span>
                </div>
            </div>
        </header>

        <main class="main-content">
            <!-- Add Task Section -->
            <section class="add-task-section">
                <h2>Create New Task</h2>
                <form id="taskForm" class="task-form">
                    <div class="form-group">
                        <label for="taskTitle">Task Title *</label>
                        <input 
                            type="text" 
                            id="taskTitle" 
                            placeholder="What needs to be done?" 
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label for="taskDescription">Description</label>
                        <textarea 
                            id="taskDescription" 
                            placeholder="Add details or notes..."
                            rows="3"
                        ></textarea>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="taskDueDate">Due Date *</label>
                            <input 
                                type="date" 
                                id="taskDueDate" 
                                required
                            >
                        </div>
                        <div class="form-group">
                            <label for="taskPriority">Priority</label>
                            <select id="taskPriority">
                                <option value="low">Low</option>
                                <option value="medium" selected>Medium</option>
                                <option value="high">High</option>
                            </select>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-primary">Add Task</button>
                </form>
            </section>

            <!-- Filter & Controls Section -->
            <section class="filters-section">
                <h2>Manage Tasks</h2>
                <div class="filter-controls">
                    <button class="filter-btn active" data-filter="all">All Tasks</button>
                    <button class="filter-btn" data-filter="pending">Pending</button>
                    <button class="filter-btn" data-filter="completed">Completed</button>
                    <button class="filter-btn" data-filter="overdue">Overdue</button>
                </div>

                <div class="sort-controls">
                    <label for="sortBy">Sort by:</label>
                    <select id="sortBy">
                        <option value="dueDate">Due Date</option>
                        <option value="priority">Priority</option>
                        <option value="dateAdded">Recently Added</option>
                    </select>
                </div>
            </section>

            <!-- Tasks List Section -->
            <section class="tasks-section">
                <div id="tasksContainer" class="tasks-container">
                    <div class="empty-state">
                        <p>✨ No tasks yet. Create one to get started!</p>
                    </div>
                </div>
            </section>
        </main>

        <!-- Edit Modal -->
        <div id="editModal" class="modal">
            <div class="modal-content">
                <span class="modal-close">&times;</span>
                <h2>Edit Task</h2>
                <form id="editForm" class="task-form">
                    <input type="hidden" id="editTaskId">
                    
                    <div class="form-group">
                        <label for="editTaskTitle">Task Title</label>
                        <input type="text" id="editTaskTitle" required>
                    </div>

                    <div class="form-group">
                        <label for="editTaskDescription">Description</label>
                        <textarea id="editTaskDescription" rows="3"></textarea>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="editTaskDueDate">Due Date</label>
                            <input type="date" id="editTaskDueDate" required>
                        </div>
                        <div class="form-group">
                            <label for="editTaskPriority">Priority</label>
                            <select id="editTaskPriority">
                                <option value="low">Low</option>
                                <option value="medium">Medium</option>
                                <option value="high">High</option>
                            </select>
                        </div>
                    </div>

                    <div class="modal-buttons">
                        <button type="submit" class="btn btn-primary">Save Changes</button>
                        <button type="button" class="btn btn-secondary" onclick="closeEditModal()">Cancel</button>
                    </div>
                </form>
            </div>
        </div>

        <!-- Reminder Notification -->
        <div id="reminderNotification" class="notification hidden">
            <div class="notification-content">
                <span class="notification-icon">⏰</span>
                <div class="notification-text">
                    <strong id="reminderTitle">Task Due Soon</strong>
                    <p id="reminderMessage">You have tasks approaching their deadline</p>
                </div>
                <button class="notification-close" onclick="closeNotification()">×</button>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
